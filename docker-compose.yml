services:
  site:
    build: .
    image: alef-group-site
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    mem_limit: 256m
    pids_limit: 100
    # Sadece sunucunun kendisinden erişilir; dışarı açılmaz.
    ports: ["127.0.0.1:8190:8182"]
